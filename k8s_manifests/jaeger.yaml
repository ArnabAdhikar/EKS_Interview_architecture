apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.53
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        ports:
        - containerPort: 16686 # Jaeger UI Port
        - containerPort: 4317  # OTLP gRPC Ingest
        - containerPort: 4318  # OTLP HTTP Ingest
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: workshop
spec:
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  selector:
    app: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: workshop
spec:
  ports:
  - name: query-ui
    port: 80
    targetPort: 16686
  selector:
    app: jaeger
