apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: workshop
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include: [ /var/log/pods/*/*/*.log ]
        exclude: []

    processors:
      batch:
        send_batch_size: 8192
        timeout: 5s
        send_batch_max_size: 10240
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

    exporters:
      opensearch:
        logs_index: "eks-container-logs"
        http:
          endpoint: "https://vpc-eks-app-logs-hfjqijbltgfra32zg6y2umc7ya.us-west-2.es.amazonaws.com"
          tls:
            insecure: false
      
      otlp/jaeger:
        endpoint: "jaeger-collector.workshop.svc.cluster.local:4317"
        tls:
          insecure: true

      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "otel"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [filelog, otlp]
          processors: [memory_limiter, batch]
          exporters: [opensearch]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.95.0
        args: ["--config=/conf/otel-collector-config.yaml"]
        volumeMounts:
        - name: config-volume
          mountPath: /conf
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        ports:
        - containerPort: 4317 # OTLP gRPC
        - containerPort: 4318 # OTLP HTTP
        - containerPort: 8889 # Prometheus Metrics Scrape port
      volumes:
      - name: config-volume
        configMap:
          name: otel-collector-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-svc
  namespace: workshop
spec:
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: metrics
    port: 8889
    targetPort: 8889
  selector:
    app: otel-collector