apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: container-resource-alerts
  namespace: prometheus
  labels:
    release: prometheus
spec:
  groups:
  - name: resource-alerts
    rules:
    - alert: EKSNodeHighCPU
      expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "EKS Host CPU usage is dangerously high (Instance: {{ $labels.instance }})"
        description: "Node CPU utilization is above 85% for more than 5 minutes."

    - alert: EKSNodeHighMemory
      expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 85
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "EKS Host Memory usage is dangerously high (Instance: {{ $labels.instance }})"
        description: "Node memory usage is above 85% for more than 5 minutes."

    - alert: PodCPUThrottling
      expr: sum(rate(container_cpu_cfs_throttled_seconds_total[5m])) by (pod, namespace) > 1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "CPU throttling detected on Pod: {{ $labels.pod }}"
        description: "Pod is hitting its configured CPU limits and is being throttled, introducing runtime latency."